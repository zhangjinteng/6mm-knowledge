[unix_http_server]
file=/tmp/knowledge-supervisor.sock
chmod=0600

[supervisord]
nodaemon=true
logfile=/data/logs/supervisor.log
logfile_maxbytes=5MB
logfile_backups=2
pidfile=/tmp/knowledge-supervisor.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/knowledge-supervisor.sock

[program:mongo]
priority=10
user=knowledge
command=/usr/local/bin/mongod --bind_ip 127.0.0.1 --port 27017 --dbpath /data/mongo --replSet knowledge --auth --keyFile /data/config/mongo.key --wiredTigerCacheSizeGB 0.5
autostart=true
autorestart=true
stopwaitsecs=30
stdout_logfile=/data/logs/mongo.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/data/logs/mongo-error.log

[program:postgres]
priority=10
user=postgres
command=/usr/lib/postgresql/17/bin/postgres -D /data/postgres -c listen_addresses=127.0.0.1 -c shared_buffers=128MB -c max_connections=30
autostart=true
autorestart=true
stopwaitsecs=30
stdout_logfile=/data/logs/postgres.log
stderr_logfile=/data/logs/postgres-error.log
stdout_logfile_maxbytes=10MB

[program:redis]
priority=10
user=knowledge
command=/usr/bin/redis-server --bind 127.0.0.1 --dir /data/redis --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy noeviction
autostart=true
autorestart=true
stopwaitsecs=15
stdout_logfile=/data/logs/redis.log
stderr_logfile=/data/logs/redis-error.log

[program:minio]
priority=10
user=knowledge
command=/usr/local/bin/minio server /data/objects --address 127.0.0.1:9000 --console-address 127.0.0.1:9001
autostart=true
autorestart=true
stopwaitsecs=20
stdout_logfile=/data/logs/minio.log
stderr_logfile=/data/logs/minio-error.log

[program:init]
priority=20
user=root
command=/usr/local/bin/node scripts/init-infrastructure.mjs
autostart=true
autorestart=unexpected
startsecs=0
exitcodes=0
stdout_logfile=/data/logs/init.log
stderr_logfile=/data/logs/init-error.log

[program:worker]
priority=30
user=knowledge
command=/usr/local/bin/node scripts/wait-and-start.mjs worker
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=60
stdout_logfile=/data/logs/worker.log
stderr_logfile=/data/logs/worker-error.log
stdout_logfile_maxbytes=10MB

[program:api]
priority=40
user=knowledge
command=/usr/local/bin/node scripts/wait-and-start.mjs server
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/data/logs/api.log
stderr_logfile=/data/logs/api-error.log
stdout_logfile_maxbytes=10MB

[program:ocr]
priority=30
user=knowledge
command=/usr/local/bin/node --import tsx src/ocr.ts
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=65
stdout_logfile=/data/logs/ocr.log
stderr_logfile=/data/logs/ocr-error.log
